name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.so }}

    # bash nos tres sistemas: no Windows o shell padrao e o PowerShell, e ele
    # desmonta "-Dexec.args=..." em dois argumentos antes de o Maven ver.
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        so: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Testes
        run: mvn -B -ntp verify

      - name: toda operacao bate com o juiz
        run: mvn -B -ntp -q exec:java -Dexec.args="correcao"

      - name: quantos bits por elemento, por densidade
        run: mvn -B -ntp -q exec:java -Dexec.args="memoria"

      - name: o custo de uma interseccao
        run: mvn -B -ntp -q exec:java -Dexec.args="interseccao"

      - name: quando a compressao por corridas aumenta o tamanho
        run: mvn -B -ntp -q exec:java -Dexec.args="corridas"

      - name: o hibrido escolhe por bloco
        run: mvn -B -ntp -q exec:java -Dexec.args="hibrido"

      - name: Relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.so }}
          path: target/surefire-reports
